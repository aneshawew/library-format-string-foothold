---
- name: Configure attacker
  hosts: attacker
  become: true
  roles:
    - role: user-access
      user_access_username: seed
      user_access_password: dees
      user_access_sudo: False
    - role: chrony
    - role: attacker

- name: Configure victim
  hosts: victim
  become: true
  roles:
    - role: user-access
      user_access_username: seed
      user_access_password: dees
      user_access_sudo: False
    - role: chrony
    - role: victim
  # No build, no run, no service unit here - victim only gets the
  # Makefile/server.c/format.c in its home directory. Compiling and
  # starting server32/server64 is done by the student, by hand, exactly
  # the way the handout's own Section 2.3 has them run `make` /
  # `make install` themselves before attacking the target.
