---
- name: apt update
  apt:
    update_cache: yes

- name: Install attacker toolkit
  apt:
    name: "{{ packages }}"
    state: present

- name: Install pwntools
  pip:
    name: pwntools
    executable: pip3

- name: Deploy attack-code/ to the student's home directory
  copy:
    src: attack-code/
    dest: /home/user/attack-code/
    owner: user
    group: user
    mode: "0644"
  # src ends in "/" so Ansible copies the *contents* of
  # roles/attacker/files/attack-code/, not the directory itself.
