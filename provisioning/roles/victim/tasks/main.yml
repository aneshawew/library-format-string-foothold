---
- name: Create server-code/ in the student's home directory
  file:
    path: /home/seed/server-code
    state: directory
    owner: seed
    group: seed
    mode: "0755"

- name: Drop this sandbox's Makefile (APG buf_size)
  template:
    src: Makefile.j2
    dest: /home/seed/server-code/Makefile
    owner: seed
    group: seed
    mode: "0644"

- name: Drop this sandbox's server.c
  template:
    src: server.c.j2
    dest: /home/seed/server-code/server.c
    owner: seed
    group: seed
    mode: "0644"

- name: Drop this sandbox's format.c (APG flag_task4 secret)
  template:
    src: format.c.j2
    dest: /home/seed/server-code/format.c
    owner: seed
    group: seed
    mode: "0644"

- name: Write the reverse-shell flag, readable only once code runs as root
  copy:
    content: "{{ flag_reverse_shell }}\n"
    dest: /root/flag_reverse_shell.txt
    owner: root
    group: root
    mode: "0600"

- name: Let the student start the (not-yet-built) server binaries as root, nothing else
  copy:
    content: |
      seed ALL=(root) NOPASSWD: /home/seed/server-code/server32, /home/seed/server-code/server64
    dest: /etc/sudoers.d/seed-server-code
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  # This is the handout's own "runs with root privilege" premise (Section
  # 2.2), scoped to exactly these two binaries so the student can start
  # the daemon themselves without a standing root shell that would make
  # /root/flag_reverse_shell.txt readable by just asking sudo for it.

