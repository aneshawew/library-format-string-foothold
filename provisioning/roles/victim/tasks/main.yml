---
- name: apt update
  apt:
    update_cache: yes

- name: Install lab toolchain (32-bit multilib, netcat, pwntools deps)
  apt:
    name: "{{ packages }}"
    state: present

- name: Install pwntools
  pip:
    name: pwntools
    executable: pip3

- name: Disable ASLR for this host
  sysctl:
    name: kernel.randomize_va_space
    value: "0"
    sysctl_set: yes
    state: present
    reload: yes

- name: Create application directory
  file:
    path: /opt/format
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render server.c for this sandbox instance (DUMMY_SIZE, secret per variables.yml)
  template:
    src: server.c.j2
    dest: /root/build_server.c
    owner: root
    group: root
    mode: "0600"

- name: Compile the vulnerable target (32-bit, executable stack)
  command: >
    gcc -m32 -z execstack -Wno-format-security -O0
    -o /opt/format/server /root/build_server.c

- name: Remove the rendered source from /root
  file:
    path: /root/build_server.c
    state: absent

- name: Write Task 6/7 flag (reachable only via code execution as root)
  copy:
    content: "{{ flag_task7 }}\n"
    dest: /root/flag_task7.txt
    owner: root
    group: root
    mode: "0600"

- name: Deploy attack-code/ to the student's home directory
  copy:
    src: attack-code/
    dest: /home/seed/attack-code/
    owner: seed
    group: seed
    mode: "0644"
  # src ends in "/" so Ansible copies the *contents* of
  # roles/victim/files/attack-code/, not the directory itself.

- name: Put Lab Handout in student's home directory
  copy:
    src: lab.pdf
    dest: /home/seed/lab.pdf
    owner: seed
    group: seed
    mode: "0644"

- name: Install the systemd unit
  template:
    src: server.service.j2
    dest: /etc/systemd/system/server.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart server

- name: Ensure the server service is enabled and running
  systemd:
    name: server
    state: started
    enabled: yes
    daemon_reload: yes
