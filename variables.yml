# APG variables: one fresh set of values is generated per sandbox instance
# by the Answers Storage service at allocation time.
# https://docs.platform.cyberrange.cz/user-guide-advanced/sandboxes/apg-variables/

# BUF_SIZE / "L" in the Makefile - the handout's own instructor knob
# ("Suggested value: between 10 and 400" - format.c). No native
# "integer in range" APG type, so, as elsewhere in this library, the
# "port" type is reused purely for its integer-range generator; the
# value is never used as a network port.
buf_size:
    type: port
    min: 10
    max: 400

# Task 2.B: the heap "secret" string in format.c.
flag_task4:
    type: text

# Task 4: dropped into /root/flag_reverse_shell.txt on the victim,
# reachable only once the student has a root shell on that machine.
flag_reverse_shell:
    type: text
