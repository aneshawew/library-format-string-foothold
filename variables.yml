# APG variables: one fresh set of values is generated per sandbox instance
# by the Answers Storage service at allocation time.
# https://docs.platform.cyberrange.cz/user-guide-advanced/sandboxes/apg-variables/

# The lab's own instructor note suggests picking one DUMMY_SIZE value
# (0-300) for the whole class, to stop students reusing last year's
# solution. We go further and generate a fresh one per sandbox instead,
# so no two students' offsets match either.
dummy_size:
    type: port
    min: 0
    max: 300

